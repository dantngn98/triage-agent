[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-agent"
version = "0.1.0"
description = "Analytics intake triage agent: tool-using context loop, validated structured triage, gated writes."
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml",
    "tenacity",
    "pandas",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
triage = "triage.__main__:main"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.setuptools.package-data]
triage = ["prompts/*.md", "prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
